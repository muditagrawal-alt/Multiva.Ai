<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61656c"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8c1a"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="10" fill="#0e0f11"/>

  <!-- stage lane, drawn like the timeline's PROC track -->
  <rect x="24" y="60" width="1152" height="150" rx="4" fill="#141518"/>
  <text x="36" y="49" font-size="11" fill="#61656c" letter-spacing="2">PIPELINE</text>
  <text x="1164" y="49" font-size="11" fill="#61656c" text-anchor="end" letter-spacing="1">EVERY STAGE RUNS ON THIS MACHINE</text>

  <!-- input -->
  <g>
    <rect x="40" y="96" width="120" height="78" rx="4" fill="#1c1e21" stroke="#303338"/>
    <text x="100" y="128" font-size="13" fill="#dcdee2" text-anchor="middle" font-weight="600">Video</text>
    <text x="100" y="150" font-size="11" fill="#90969d" text-anchor="middle">talking head</text>
  </g>
  <line x1="160" y1="135" x2="196" y2="135" stroke="#61656c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- transcribe -->
  <g>
    <rect x="200" y="84" width="190" height="102" rx="4" fill="#1c1e21" stroke="#303338"/>
    <rect x="200" y="84" width="4" height="102" fill="#ff8c1a"/>
    <text x="218" y="108" font-size="11" fill="#ff8c1a" font-weight="700" letter-spacing="1.5">TRANSCRIBE</text>
    <text x="218" y="132" font-size="14" fill="#dcdee2" font-weight="600">faster-whisper</text>
    <text x="218" y="150" font-size="11" fill="#90969d">large-v3 · word timestamps</text>
    <rect x="218" y="160" width="34" height="16" rx="3" fill="#24262a"/>
    <text x="235" y="172" font-size="9.5" fill="#90969d" text-anchor="middle" font-weight="600">CPU</text>
  </g>
  <line x1="390" y1="135" x2="426" y2="135" stroke="#61656c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- translate -->
  <g>
    <rect x="430" y="84" width="190" height="102" rx="4" fill="#1c1e21" stroke="#303338"/>
    <rect x="430" y="84" width="4" height="102" fill="#ff8c1a"/>
    <text x="448" y="108" font-size="11" fill="#ff8c1a" font-weight="700" letter-spacing="1.5">TRANSLATE</text>
    <text x="448" y="132" font-size="14" fill="#dcdee2" font-weight="600">NLLB-200</text>
    <text x="448" y="150" font-size="11" fill="#90969d">distilled 600M · 200 languages</text>
    <rect x="448" y="160" width="34" height="16" rx="3" fill="#24262a"/>
    <text x="465" y="172" font-size="9.5" fill="#90969d" text-anchor="middle" font-weight="600">MPS</text>
  </g>
  <line x1="620" y1="135" x2="656" y2="135" stroke="#61656c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- clone -->
  <g>
    <rect x="660" y="84" width="190" height="102" rx="4" fill="#1c1e21" stroke="#303338"/>
    <rect x="660" y="84" width="4" height="102" fill="#ff8c1a"/>
    <text x="678" y="108" font-size="11" fill="#ff8c1a" font-weight="700" letter-spacing="1.5">CLONE &amp; SPEAK</text>
    <text x="678" y="132" font-size="14" fill="#dcdee2" font-weight="600">IndicF5</text>
    <text x="678" y="150" font-size="11" fill="#90969d">zero-shot · 12 Indian languages</text>
    <rect x="678" y="160" width="34" height="16" rx="3" fill="#24262a"/>
    <text x="695" y="172" font-size="9.5" fill="#90969d" text-anchor="middle" font-weight="600">MPS</text>
  </g>
  <line x1="850" y1="135" x2="886" y2="135" stroke="#61656c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- lip sync -->
  <g>
    <rect x="890" y="84" width="150" height="102" rx="4" fill="#1c1e21" stroke="#303338"/>
    <rect x="890" y="84" width="4" height="102" fill="#ff8c1a"/>
    <text x="908" y="108" font-size="11" fill="#ff8c1a" font-weight="700" letter-spacing="1.5">LIP SYNC</text>
    <text x="908" y="132" font-size="14" fill="#dcdee2" font-weight="600">Wav2Lip</text>
    <text x="908" y="150" font-size="11" fill="#90969d">s3fd · GAN</text>
    <rect x="908" y="160" width="34" height="16" rx="3" fill="#24262a"/>
    <text x="925" y="172" font-size="9.5" fill="#90969d" text-anchor="middle" font-weight="600">MPS</text>
  </g>
  <line x1="1040" y1="135" x2="1076" y2="135" stroke="#ff8c1a" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- output -->
  <g>
    <rect x="1080" y="96" width="84" height="78" rx="4" fill="#2a1d10" stroke="#7a4410"/>
    <text x="1122" y="128" font-size="13" fill="#ff8c1a" text-anchor="middle" font-weight="600">Dub</text>
    <text x="1122" y="150" font-size="11" fill="#d99b2b" text-anchor="middle">same voice</text>
  </g>

  <!-- the outputs that leave early -->
  <text x="36" y="245" font-size="11" fill="#61656c" letter-spacing="2">OTHER OUTPUTS</text>
  <path d="M 295 186 L 295 262 L 380 262" fill="none" stroke="#303338" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 525 186 L 525 296 L 610 296" fill="none" stroke="#303338" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 755 186 L 755 262 L 840 262" fill="none" stroke="#303338" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g>
    <rect x="380" y="248" width="180" height="28" rx="3" fill="#1c1e21" stroke="#303338"/>
    <text x="392" y="267" font-size="12" fill="#dcdee2">Subtitles · SRT / VTT</text>
  </g>
  <g>
    <rect x="610" y="282" width="210" height="28" rx="3" fill="#1c1e21" stroke="#303338"/>
    <text x="622" y="301" font-size="12" fill="#dcdee2">Subtitled video · any language</text>
  </g>
  <g>
    <rect x="840" y="248" width="200" height="28" rx="3" fill="#1c1e21" stroke="#303338"/>
    <text x="852" y="267" font-size="12" fill="#dcdee2">Audio dub · Voice-over</text>
  </g>

  <text x="1164" y="245" font-size="11" fill="#61656c" text-anchor="end" letter-spacing="1">A SECOND OUTPUT OF THE SAME CLIP REUSES THE TRANSCRIPT AND TRANSLATION</text>
</svg>
