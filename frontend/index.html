<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Multiva - dub video into Indian languages, in your own voice</title>
    <meta name="description" content="Offline video dubbing across eleven Indian languages. Keeps the speaker's voice, re-syncs their lips, and never sends footage off your machine." />
    <script>
      // Set the theme before first paint so a dark-mode reload never flashes light.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q === "light" || q === "dark" ? q : localStorage.getItem("multiva.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
