<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multiva Studio</title>
<style>
  /*
    Startup screen, in the shape professional applications use: identity and
    the real loading state on the left, the product on the right, small print
    underneath. The window is sized for this and resized to the workspace
    once the engine reports ready.

    The stage line is not decoration. It names the model actually being loaded,
    reported by /api/boot and relayed by the Rust side.
  */
  :root {
    --void: #0e0f11;
    --panel: #17181b;
    --edge: #0a0b0c;
    --rule: #2b2e33;
    --text: #dcdee2;
    --dim: #90969d;
    --mute: #61656c;
    --accent: #ff8c1a;
    --bad: #d95c4a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--void);
    color: var(--text);
    font: 400 12px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
    display: grid;
    grid-template-columns: minmax(300px, 43%) 1fr;
  }

  /* ---- left: identity, state, small print ---- */
  .panel {
    background: var(--panel);
    border-right: 1px solid var(--edge);
    padding: 26px 24px 18px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .mark { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .mark i { display: block; width: 3px; background: var(--rule); border-radius: 1px; }
  .mark i:nth-child(1) { height: 7px; }
  .mark i:nth-child(2) { height: 13px; }
  .mark i:nth-child(3) { height: 20px; background: var(--accent); }
  .mark i:nth-child(4) { height: 12px; }
  .mark i:nth-child(5) { height: 6px; }

  h1 {
    margin-top: 16px;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.05;
  }
  .version {
    margin-top: 4px;
    font-size: 15px;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
  }

  .state { margin-top: auto; }
  .track {
    width: 100%; height: 2px; background: var(--edge);
    overflow: hidden; margin-bottom: 10px;
  }
  .track b {
    display: block; height: 100%; width: 0%;
    background: var(--accent);
    transition: width .45s cubic-bezier(.32,.72,0,1);
  }
  #stage {
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    min-height: 1.4em;
  }
  body.failed #stage { color: var(--bad); text-transform: none; letter-spacing: 0; font-size: 11px; }
  body.failed .track b { background: var(--bad); width: 100% !important; }

  .fine {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--edge);
    font-size: 9px;
    line-height: 1.65;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- right: the product ---- */
  figure { position: relative; overflow: hidden; background: var(--void); }
  figure img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 78% center;   /* keep the device in frame at any size */
  }
  /* Blend the photo into the panel edge instead of butting against it. */
  figure::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(14,15,17,.85) 0%, rgba(14,15,17,0) 26%);
    pointer-events: none;
  }

  @media (max-width: 620px) {
    body { grid-template-columns: 1fr; }
    figure { display: none; }
  }
</style>
</head>
<body>
  <section class="panel">
    <span class="mark" aria-hidden><i></i><i></i><i></i><i></i><i></i></span>
    <h1>Multiva</h1>
    <p class="version">1.0</p>

    <div class="state">
      <div class="track"><b id="bar"></b></div>
      <p id="stage">Starting the engine</p>
      <p class="fine">
        &copy; 2026 Multiva. Everything runs on this machine; no audio or video
        leaves it. Speech recognition by Whisper. Translation by NLLB-200.
        Voice synthesis by IndicF5. Lip sync by Wav2Lip.
      </p>
    </div>
  </section>

  <figure>
    <img src="product.png" alt="" />
  </figure>

<script>
  var stage = document.getElementById("stage");
  var bar = document.getElementById("bar");

  var api = window.__TAURI__ && window.__TAURI__.event;
  if (api) {
    api.listen("startup", function (evt) {
      var s = evt.payload || {};
      if (s.detail) stage.textContent = s.detail;
      if (typeof s.progress === "number") bar.style.width = s.progress + "%";
      document.body.className = s.fatal ? "failed" : "";
    });
  } else {
    stage.textContent = "Waiting for the desktop shell";
  }
</script>
</body>
</html>
